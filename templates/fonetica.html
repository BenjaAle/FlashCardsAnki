<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Laboratorio de Pronunciación</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    /* Estilos del Laboratorio */
    .grid-fonemas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .card-fonema {
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .card-fonema:hover, .card-fonema.active {
      border-color: #8e44ad;
      background: #fbf5ff;
      transform: translateY(-2px);
    }
    .simbolo-fonema {
      font-size: 32px;
      font-weight: bold;
      color: #8e44ad;
      margin-bottom: 5px;
    }
    .gym-container {
      background: #1e293b;
      color: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      margin-top: 20px;
      display: none; /* Se muestra al iniciar el juego */
    }
    .gym-btn {
      background: white;
      color: #1e293b;
      font-size: 24px;
      font-weight: bold;
      padding: 15px 30px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin: 10px;
      width: 200px;
      transition: 0.2s;
    }
    .gym-btn:hover { background: #cbd5e1; }
    .gym-btn.correct { background: #27ae60; color: white; }
    .gym-btn.wrong { background: #e74c3c; color: white; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="sidebar">
      <a href="/" style="text-decoration: none;"><button class="new-chat-btn" style="width:100%; margin-bottom:10px; background:#475569;">💬 Volver al Chat</button></a>
      <a href="/historias" style="text-decoration: none;"><button class="new-chat-btn" style="width:100%; background:#3b82f6;">📚 Ir a Historias</button></a>
      
      <h3 style="margin-top:30px; border-bottom:1px solid #334155; padding-bottom:10px;">🧠 El Gimnasio</h3>
      <p style="font-size:13px; color:#cbd5e1; line-height:1.5;">Selecciona dos fonemas que te confundan y haz clic en Entrenar.</p>
      
      <div style="display:flex; gap:10px; margin-top:10px;">
        <input type="text" id="fonema-1" placeholder="Ej: /ɪ/" style="width:50%; text-align:center; font-weight:bold;">
        <input type="text" id="fonema-2" placeholder="Ej: /iː/" style="width:50%; text-align:center; font-weight:bold;">
      </div>
      <button id="btn-entrenar" class="new-chat-btn" style="width:100%; margin-top:10px; background:#e67e22;">🏋️‍♂️ Iniciar Entrenamiento</button>
    </div>

    <div class="chat-container" style="padding: 20px; overflow-y: auto; background: #fafafa;">
      <div class="header" style="border-radius: 8px; background: #8e44ad;">
        <h2>🗣️ Laboratorio de Fonética</h2>
      </div>

      <!-- El Gimnasio (Oculto por defecto) -->
      <div id="gym-zone" class="gym-container">
        <h3 id="gym-status" style="margin-top:0;">Cargando minijuego... ⏳</h3>
        <button id="btn-play-gym" style="background:#3498db; color:white; border:none; border-radius:50%; width:80px; height:80px; font-size:30px; cursor:pointer; margin:20px 0; display:none;">🔊</button>
        <div id="gym-options" style="display:none;">
          <button class="gym-btn" id="btn-opt-a">Opción A</button>
          <button class="gym-btn" id="btn-opt-b">Opción B</button>
        </div>
      </div>

      <!-- La Tabla Fonética -->
      <h3 style="margin-top:30px; color:#1e293b;">1. Prioridad Máxima (El Top 10)</h3>
      <div id="grid-fonemas" class="grid-fonemas"></div>

      <!-- 👇 NUEVO: La Tabla de Connected Speech 👇 -->
      <h3 style="margin-top:40px; color:#1e293b; border-top: 2px solid #e2e8f0; padding-top: 20px;">2. Discurso Conectado (Velocidad Nativa)</h3>
      <p style="font-size:14px; color:#64748b; margin-bottom: 15px;">Cómo los nativos unen, cortan y transforman las palabras por "pereza" muscular.</p>
      <div id="grid-connected" class="grid-fonemas"></div>
      
    </div>
  </div>

  <script src="/static/fonetica.js"></script>
</body>
</html>
