<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Laboratorio de Pronunciación</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/index.css" />
    <link rel="stylesheet" href="/static/css/fonetica.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="sidebar fonetica-sidebar">
        <a href="/" class="link-reset"
          ><button class="new-chat-btn btn-back btn-full mb-10">
            💬 Volver al Chat
          </button></a
        >
        <a href="/historias" class="link-reset"
          ><button class="new-chat-btn btn-historias btn-full">
            📚 Ir a Historias
          </button></a
        >

        <h3 class="sidebar-section-title mt-30">🧠 El Gimnasio</h3>
        <p class="sidebar-description">
          Selecciona dos fonemas que te confundan y haz clic en Entrenar.
        </p>

        <div class="training-inputs">
          <input
            type="text"
            id="fonema-1"
            placeholder="Ej: /ɪ/"
            class="training-input"
          />
          <input
            type="text"
            id="fonema-2"
            placeholder="Ej: /iː/"
            class="training-input"
          />
        </div>
        <button
          id="btn-entrenar"
          class="new-chat-btn btn-training btn-full mt-10"
        >
          🏋️‍♂️ Iniciar Entrenamiento
        </button>
      </div>

      <div class="chat-container fonetica-chat-container">
        <div class="header fonetica-header">
          <h2>🗣️ Laboratorio de Fonética</h2>
        </div>

        <!-- El Gimnasio (Oculto por defecto) -->
        <div id="gym-zone" class="gym-container">
          <h3 id="gym-status" class="gym-status">Cargando minijuego... ⏳</h3>
          <button id="btn-play-gym" class="gym-play-btn">🔊</button>
          <div id="gym-options" class="gym-options">
            <button class="gym-btn" id="btn-opt-a">Opción A</button>
            <button class="gym-btn" id="btn-opt-b">Opción B</button>
          </div>
        </div>

        <!-- La Tabla Fonética -->
        <h3 class="section-title mt-30">Fonemas</h3>
        <div id="grid-fonemas" class="grid-fonemas"></div>

        <!-- 👇 NUEVO: La Tabla de Connected Speech 👇 -->
        <h3 class="section-title connected-title">
          2. Discurso Conectado (Velocidad Nativa)
        </h3>
        <p class="section-description">
          Cómo los nativos unen, cortan y transforman las palabras por "pereza"
          muscular.
        </p>
        <div id="grid-connected" class="grid-fonemas"></div>
      </div>
    </div>

    <script src="/static/js/fonetica.js"></script>
  </body>
</html>
