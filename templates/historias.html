<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historias Interactivas IA</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/index.css" />
    <link rel="stylesheet" href="/static/css/historias.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="sidebar historias-sidebar">
        <a href="/" class="link-reset">
          <button class="new-chat-btn btn-back btn-full">
            ⬅ Volver al Chat
          </button>
        </a>
        <!-- Añadir a la barra lateral de index.html e historias.html -->
        <a href="/fonetica" class="link-reset">
          <button class="new-chat-btn btn-fonetica btn-full mb-0">
            🗣️ Fonética
          </button>
        </a>
        <h3 class="sidebar-section-title mt-20">Generar Historia</h3>

        <div class="story-form">
          <label class="story-label">Temática:</label>
          <textarea
            id="tema-input"
            rows="3"
            placeholder="Escribe de que quieres que se trate tu historia..."
            class="story-textarea"
          ></textarea>

          <button id="btn-generar" class="new-chat-btn btn-compact">
            ✨ Generar y Crear Audios
          </button>
        </div>

        <h3 class="sidebar-section-title library-title">📖 Mi Biblioteca</h3>
        <div id="lista-historias" class="chat-list story-list"></div>
      </div>

      <div class="chat-container historias-chat-container">
        <div class="header historias-header">
          <div class="historias-header-row">
            <h2 id="historia-titulo">📚 Reproductor de Historias</h2>

            <select id="velocidad-audio" class="speed-select">
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option>
            </select>

            <button class="anki-btn" id="btn-play-all">
              ▶ Reproducir Historia
            </button>

          </div>
          <audio id="audio-player" controls class="story-audio-player"></audio>
        </div>

        <div class="story-controls">
          <button class="mode-btn active" data-mode="completo">
            1. Comprensión<br /><span class="mode-subtitle"
              >(Audio + EN + ES)</span
            >
          </button>
          <button class="mode-btn" data-mode="lectura">
            2. Adquisición<br /><span class="mode-subtitle">(Audio + EN)</span>
          </button>
          <button class="mode-btn" data-mode="escucha">
            3. Inmersión<br /><span class="mode-subtitle">(Solo Audio)</span>
          </button>
        </div>

        <div id="story-board">
          <div class="story-empty-state">
            Genera una historia en la barra lateral para comenzar.
          </div>
        </div>
      </div>
    </div>

    <div id="floating-anki-btn" class="floating-anki-btn">🪄 + Anki</div>

    <div id="modal-revision" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>🔍 Revisa tu nueva carta</h3>
          <span class="close-modal" id="btn-cerrar-modal">&times;</span>
        </div>
        <div id="lista-revision" class="lista-revision"></div>
        <div class="modal-footer">
          <button id="btn-confirmar-todo" class="confirm-btn">
            Confirmar e Inyectar a Anki
          </button>
        </div>
      </div>
    </div>

    <script src="/static/js/historias.js"></script>
  </body>
</html>
