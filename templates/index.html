<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutor de Inglés IA</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="sidebar">
        <div
          style="
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
          "
        >
          <button
            id="btn-new-chat"
            class="new-chat-btn"
            style="margin-bottom: 0"
          >
            + Nuevo Chat
          </button>

          <a href="/historias" style="text-decoration: none">
            <button
              class="new-chat-btn"
              style="width: 100%; margin-bottom: 0; background-color: #8e44ad"
            >
              📚 Historias IA
            </button>
          </a>
          <!-- Añadir a la barra lateral de index.html e historias.html -->
          <a href="/fonetica" style="text-decoration: none;">
              <button class="new-chat-btn" style="width: 100%; margin-bottom: 0; background-color: #f39c12;">🗣️ Fonética</button>
          </a>
        </div>

        <div
          id="new-chat-form"
          style="
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
          "
        >
          <input
            type="text"
            id="new-chat-input"
            placeholder="Nombre de la sesión..."
            style="
              padding: 10px;
              border-radius: 6px;
              border: none;
              font-size: 14px;
            "
          />
          <div style="display: flex; gap: 5px">
            <button
              id="btn-confirm-chat"
              style="
                flex: 1;
                background: #27ae60;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                padding: 8px;
                font-weight: bold;
              "
            >
              Crear
            </button>
            <button
              id="btn-cancel-chat"
              style="
                flex: 1;
                background: #e74c3c;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                padding: 8px;
                font-weight: bold;
              "
            >
              Cancelar
            </button>
          </div>
        </div>

        <div id="chat-list" class="chat-list"></div>
      </div>

      <div class="chat-container">
        <div class="header">
          <h2 id="chat-title">🇬🇧 Tutor IA</h2>
          <button class="anki-btn" id="btn-anki">Extraer a Anki</button>
        </div>

        <div class="chat-box" id="chat-box"></div>

        <div class="input-area">
          <textarea
            id="user-input"
            placeholder="Escribe tu mensaje aquí... (Shift + Enter para salto de línea)"
            rows="1"
          ></textarea>
          <button class="send-btn" id="btn-send">Enviar</button>
        </div>
      </div>
    </div>

    <div id="modal-revision" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>🔍 Revisa tus nuevas cartas</h3>
          <span class="close-modal" id="btn-cerrar-modal">&times;</span>
        </div>
        <div id="lista-revision" class="lista-revision"></div>
        <div class="modal-footer">
          <button id="btn-confirmar-todo" class="confirm-btn">
            Confirmar e Inyectar a Anki
          </button>
        </div>
      </div>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
