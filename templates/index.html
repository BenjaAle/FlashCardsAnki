<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutor de Inglés IA</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/index.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="sidebar">
        <div class="sidebar-actions">
          <button
            id="btn-new-chat"
            class="new-chat-btn btn-compact"
          >
            + Nuevo Chat
          </button>

          <a href="/historias" class="sidebar-link">
            <button class="new-chat-btn btn-compact btn-historias">
              📚 Historias IA
            </button>
          </a>
          <!-- Añadir a la barra lateral de index.html e historias.html -->
          <a href="/fonetica" class="sidebar-link">
              <button class="new-chat-btn btn-compact btn-fonetica">🗣️ Fonética</button>
          </a>
        </div>

        <div id="new-chat-form" class="new-chat-form">
          <input
            type="text"
            id="new-chat-input"
            placeholder="Nombre de la sesión..."
            class="new-chat-input"
          />
          <div class="new-chat-actions">
            <button
              id="btn-confirm-chat"
              class="new-chat-action confirm"
            >
              Crear
            </button>
            <button
              id="btn-cancel-chat"
              class="new-chat-action cancel"
            >
              Cancelar
            </button>
          </div>
        </div>

        <div id="chat-list" class="chat-list"></div>
      </div>

      <div class="chat-container">
        <div class="header">
          <h2 id="chat-title">Tutor IA</h2>
          <button class="anki-btn" id="btn-anki">Extraer a Anki</button>
        </div>

        <div class="chat-box" id="chat-box"></div>

        <div class="input-area">
          <textarea
            id="user-input"
            placeholder="Escribe tu mensaje aquí... (Shift + Enter para salto de línea)"
            rows="1"
          ></textarea>
          <button class="send-btn" id="btn-send">Enviar</button>
        </div>
      </div>
    </div>

    <div id="modal-revision" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>🔍 Revisa tus nuevas cartas</h3>
          <span class="close-modal" id="btn-cerrar-modal">&times;</span>
        </div>
        <div id="lista-revision" class="lista-revision"></div>
        <div class="modal-footer">
          <button id="btn-confirmar-todo" class="confirm-btn">
            Confirmar e Inyectar a Anki
          </button>
        </div>
      </div>
    </div>

    <script src="/static/js/script.js"></script>
  </body>
</html>
